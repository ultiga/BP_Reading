<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BP Reading Data System</title>
  <style>
    :root {
      --primary: #1976d2;
      --primary-hover: #1565c0;
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #212121;
      --text-muted: #666666;
      --border: #dcdcdc;
      --success: #2e7d32;
      --error: #c62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      background: var(--surface);
      width: 100%;
      max-width: 520px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 28px;
    }

    h2 {
      margin-bottom: 6px;
      font-size: 24px;
      color: #1a237e;
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      position: relative;
    }

    .upload-zone:hover {
      background: #f0f4f8;
      border-color: var(--primary);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .preview-container {
      display: none;
      margin-top: 14px;
      text-align: center;
    }

    .preview-img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn:disabled {
      background: #b0bec5;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }

    .status-box.info {
      background: #e3f2fd;
      color: #0d47a1;
      display: block;
    }

    .status-box.success {
      background: #e8f5e9;
      color: var(--success);
      display: block;
    }

    .status-box.error {
      background: #ffebee;
      color: var(--error);
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>BP Reading Data</h2>
    <p class="subtitle">Snap or upload a photo of your blood pressure monitor</p>

    <form id="bpForm">
      <!-- File Upload Zone -->
      <div class="form-group">
        <label>Upload / Capture Image</label>
        <div class="upload-zone">
          <input type="file" id="imageInput" accept="image/*" capture="environment" required />
          <span id="uploadPrompt">📷 Click to upload or snap a photo</span>
        </div>
        <div class="preview-container" id="previewContainer">
          <img id="imagePreview" class="preview-img" alt="Device Preview" />
        </div>
      </div>

      <!-- Readings (Auto-filled by OCR, user-editable) -->
      <div class="grid-3">
        <div class="form-group">
          <label for="sysInput">SYS (mmHg)</label>
          <input type="number" id="sysInput" placeholder="120" required />
        </div>
        <div class="form-group">
          <label for="diaInput">DIA (mmHg)</label>
          <input type="number" id="diaInput" placeholder="80" required />
        </div>
        <div class="form-group">
          <label for="pulseInput">Pulse (BPM)</label>
          <input type="number" id="pulseInput" placeholder="72" required />
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn">Submit to Google Sheet</button>
    </form>

    <div id="statusMessage" class="status-box"></div>
  </div>

  <script>
    // Set your deployed Apps Script Web App URL here:
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyBQwmUQ26OHBgQhwGNQ7uWmrDCW8F5uPQymE-1_kcB7eJuv0kN28jMW23Y2tOh-l3w/exec';

    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewContainer = document.getElementById('previewContainer');
    const uploadPrompt = document.getElementById('uploadPrompt');
    const sysInput = document.getElementById('sysInput');
    const diaInput = document.getElementById('diaInput');
    const pulseInput = document.getElementById('pulseInput');
    const bpForm = document.getElementById('bpForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    let currentBase64 = null;
    let currentMimeType = null;

    // Handle Image Selection and Automatic OCR processing
    imageInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      currentMimeType = file.type || 'image/jpeg';
      uploadPrompt.textContent = file.name;

      // Display Preview
      const reader = new FileReader();
      reader.onload = async (event) => {
        const fullDataUrl = event.target.result;
        imagePreview.src = fullDataUrl;
        previewContainer.style.display = 'block';

        // Extract raw Base64 string
        currentBase64 = fullDataUrl.split(',')[1];

        // Trigger automatic OCR scan
        runOcrScan(currentBase64, currentMimeType);
      };
      reader.readAsDataURL(file);
    });

    async function runOcrScan(base64Data, mimeType) {
      showStatus('Scanning picture with OCR, please wait...', 'info', true);
      submitBtn.disabled = true;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'ocr',
            base64Data: base64Data,
            mimeType: mimeType
          })
        });

        const res = await response.json();
        if (res.status === 'success' && res.data) {
          if (res.data.sys) sysInput.value = res.data.sys;
          if (res.data.dia) diaInput.value = res.data.dia;
          if (res.data.pulse) pulseInput.value = res.data.pulse;

          showStatus('Values detected! Verify and click Submit.', 'success');
        } else {
          showStatus('Could not auto-read text clearly. Please enter values manually.', 'info');
        }
      } catch (err) {
        showStatus('OCR processing timed out. Please input values manually.', 'info');
      } finally {
        submitBtn.disabled = false;
      }
    }

    // Form Submission
    bpForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!currentBase64) {
        showStatus('Please upload or capture a photo first.', 'error');
        return;
      }

      showStatus('Uploading image and writing to Google Sheet...', 'info', true);
      submitBtn.disabled = true;

      try {
        const payload = {
          action: 'save',
          base64Data: currentBase64,
          mimeType: currentMimeType,
          sys: sysInput.value,
          dia: diaInput.value,
          pulse: pulseInput.value
        };

        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          showStatus(`Saved! Record #${result.record.no} recorded for ${result.record.date} ${result.record.time}.`, 'success');
          bpForm.reset();
          previewContainer.style.display = 'none';
          uploadPrompt.textContent = '📷 Click to upload or snap a photo';
          currentBase64 = null;
        } else {
          showStatus('Failed to record data: ' + result.message, 'error');
        }
      } catch (err) {
        showStatus('Submission error: ' + err.message, 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });

    function showStatus(text, type, showSpinner = false) {
      statusMessage.className = 'status-box ' + type;
      if (showSpinner) {
        statusMessage.innerHTML = '<span class="spinner"></span>' + text;
      } else {
        statusMessage.textContent = text;
      }
    }
  </script>
</body>
</html>
