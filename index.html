<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BP Reading Data Entry</title>
  
  <!-- Tesseract.js CDN for Client-side OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
      padding: 28px;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-sheet {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #0f766e;
      background: #ccfbf1;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-sheet:hover {
      background: #99f6e4;
    }

    /* Upload Area */
    .upload-card {
      border: 2px dashed var(--primary);
      background: #f0f9ff;
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      position: relative;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }

    .upload-card:hover {
      background: #e0f2fe;
    }

    .upload-card input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .upload-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
    }

    .upload-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Preview & OCR Status */
    .preview-container {
      display: none;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: #000;
      position: relative;
    }

    .preview-container img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      display: block;
    }

    .ocr-status {
      display: none;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 500;
      margin-bottom: 20px;
      align-items: center;
      gap: 8px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #0284c7;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Form Fields Grid */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: span 2;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-muted);
    }

    input {
      padding: 10px 12px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border 0.2s;
      background: #fff;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    input[readonly] {
      background: #f1f5f9;
      color: #475569;
      cursor: not-allowed;
    }

    .reading-highlight {
      border-color: #38bdf8;
      background-color: #f8fafc;
      font-weight: 700;
      font-size: 1.1rem;
      color: #0369a1;
    }

    /* Actions */
    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    /* Notification Box */
    .alert {
      display: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-top: 16px;
    }

    .alert.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .alert.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    @media (max-width: 500px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-group.full {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <h1>🩺 BP Reading Data Entry</h1>
      <!-- Link to Google Sheet -->
      <a href="YOUR_SPREADSHEET_URL" target="_blank" rel="noopener noreferrer" class="btn-sheet" id="sheetLink">
        📊 Open Google Sheet
      </a>
    </div>
    <p style="font-size: 0.85rem; color: var(--text-muted);">
      Capture or upload your blood pressure monitor photo. The OCR automatically extracts SYS, DIA, and Pulse readings.
    </p>
  </div>

  <!-- Upload Area -->
  <div class="upload-card">
    <input type="file" id="imageInput" accept="image/*" capture="environment" />
    <div class="upload-icon">📷</div>
    <div class="upload-text">Take Photo or Upload Picture</div>
    <div class="upload-sub">Supports camera capture on mobile or JPG/PNG image</div>
  </div>

  <!-- Image Preview -->
  <div class="preview-container" id="previewContainer">
    <img id="imagePreview" alt="Blood Pressure Monitor" />
  </div>

  <!-- OCR Scanning Status -->
  <div class="ocr-status" id="ocrStatus">
    <div class="spinner"></div>
    <span id="ocrStatusText">Reading text from monitor picture...</span>
  </div>

  <!-- Form Details -->
  <form id="bpForm">
    <div class="form-grid">
      <!-- Auto Sequence No -->
      <div class="form-group">
        <label for="noField">No (Auto Sequence)</label>
        <input type="text" id="noField" readonly placeholder="Loading..." />
      </div>

      <!-- Date (dd/mm/yyyy) -->
      <div class="form-group">
        <label for="dateField">Date (dd/mm/yyyy)</label>
        <input type="text" id="dateField" required />
      </div>

      <!-- Time (hh:mm AM/PM) -->
      <div class="form-group">
        <label for="timeField">Time (hh:mm AM/PM)</label>
        <input type="text" id="timeField" required />
      </div>

      <!-- Systolic (mmHg) -->
      <div class="form-group">
        <label for="sysField">Systolic (mmHg)</label>
        <input type="number" id="sysField" class="reading-highlight" placeholder="e.g. 130" required />
      </div>

      <!-- Diastolic (mmHg) -->
      <div class="form-group">
        <label for="diaField">Diastolic (mmHg)</label>
        <input type="number" id="diaField" class="reading-highlight" placeholder="e.g. 81" required />
      </div>

      <!-- Pulse (BPM) -->
      <div class="form-group">
        <label for="pulseField">Pulse (BPM)</label>
        <input type="number" id="pulseField" class="reading-highlight" placeholder="e.g. 86" required />
      </div>

      <!-- Uploaded Picture URL -->
      <div class="form-group full">
        <label for="urlField">Uploaded Picture URL</label>
        <input type="text" id="urlField" readonly placeholder="Will be populated once submitted to Google Drive" />
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="submit-btn" id="submitBtn">
      <span>💾 Submit to Google Sheet</span>
    </button>
  </form>

  <!-- Status / Alert Message -->
  <div class="alert" id="alertBox"></div>
</div>

<script>
  // ================= CONFIGURATION =================
  // 1. Paste your deployed Google Apps Script Web App URL here:
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzWPgRxFheWGHayziV2bC-s9t_8DuBmBJ_pLYeWmcpGD1brt1niIhnU-C-4HhLBgLnN2Q/exec';

  // 2. Paste your Google Sheet URL here:
  const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/1Xg6JgwERsxoJTGi7pdK4AnxSkeoD7kPn-tBbesTHyTI/edit?usp=sharing';
  document.getElementById('sheetLink').href = SPREADSHEET_URL;

  // Global state
  let currentBase64Image = null;
  let currentMimeType = 'image/jpeg';
  let currentFileName = '';

  // DOM Elements
  const imageInput = document.getElementById('imageInput');
  const previewContainer = document.getElementById('previewContainer');
  const imagePreview = document.getElementById('imagePreview');
  const ocrStatus = document.getElementById('ocrStatus');
  const ocrStatusText = document.getElementById('ocrStatusText');
  const noField = document.getElementById('noField');
  const dateField = document.getElementById('dateField');
  const timeField = document.getElementById('timeField');
  const sysField = document.getElementById('sysField');
  const diaField = document.getElementById('diaField');
  const pulseField = document.getElementById('pulseField');
  const urlField = document.getElementById('urlField');
  const bpForm = document.getElementById('bpForm');
  const submitBtn = document.getElementById('submitBtn');
  const alertBox = document.getElementById('alertBox');

  // Format Date to dd/mm/yyyy
  function getFormattedDate(d = new Date()) {
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = d.getFullYear();
    return `${dd}/${mm}/${yyyy}`;
  }

  // Format Time to hh:mm AM/PM
  function getFormattedTime(d = new Date()) {
    let hours = d.getHours();
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12; // 0 hour converts to 12
    const strHours = String(hours).padStart(2, '0');
    return `${strHours}:${minutes} ${ampm}`;
  }

  // Initialize Date, Time, and Next Sequence Number
  function initDateTime() {
    dateField.value = getFormattedDate();
    timeField.value = getFormattedTime();
  }

  async function fetchNextSequenceNumber() {
    try {
      const response = await fetch(`${SCRIPT_URL}?action=getNextNo`);
      const data = await response.json();
      if (data && data.nextNo) {
        noField.value = data.nextNo;
      }
    } catch (err) {
      console.warn('Could not pre-fetch sequence number:', err);
      noField.value = 'Auto';
    }
  }

  // Handle Image Selection
  imageInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    currentFileName = file.name;
    currentMimeType = file.type || 'image/jpeg';

    // Show preview
    const reader = new FileReader();
    reader.onload = async (event) => {
      imagePreview.src = event.target.result;
      previewContainer.style.display = 'block';

      // Save raw base64 string (strip data:*/*;base64, prefix)
      currentBase64Image = event.target.result.split(',')[1];

      // Refresh timestamp on photo selection
      initDateTime();

      // Run OCR Extraction
      await processImageWithOCR(event.target.result);
    };
    reader.readAsDataURL(file);
  });

  /**
   * Pre-processes image via HTML Canvas to enhance digital LCD segments
   * and runs Tesseract.js OCR
   */
  async function processImageWithOCR(imageSrc) {
    ocrStatus.style.display = 'flex';
    ocrStatusText.textContent = 'Optimizing image for LCD display recognition...';

    const img = new Image();
    img.src = imageSrc;
    await img.decode();

    // Canvas pre-processing (Grayscale + High Contrast Thresholding)
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;

    // Convert to grayscale and apply contrast boost
    for (let i = 0; i < d.length; i += 4) {
      const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      // Adaptive contrast thresholding
      const val = gray < 135 ? 0 : 255;
      d[i] = val;
      d[i + 1] = val;
      d[i + 2] = val;
    }
    ctx.putImageData(imgData, 0, 0);

    ocrStatusText.textContent = 'Analyzing Blood Pressure digits...';

    try {
      const result = await Tesseract.recognize(canvas, 'eng', {
        logger: (m) => {
          if (m.status === 'recognizing text') {
            ocrStatusText.textContent = `Reading monitor text... ${Math.round(m.progress * 100)}%`;
          }
        }
      });

      const extractedText = result.data.text;
      console.log('OCR Raw Text:', extractedText);
      parseBpReadings(extractedText);

      ocrStatus.style.display = 'flex';
      ocrStatus.style.background = '#dcfce7';
      ocrStatus.style.color = '#166534';
      ocrStatusText.textContent = 'Values extracted! Please verify fields before submitting.';
    } catch (err) {
      console.error('OCR Error:', err);
      ocrStatus.style.background = '#fee2e2';
      ocrStatus.style.color = '#991b1b';
      ocrStatusText.textContent = 'Could not auto-read text clearly. Please manually type the numbers.';
    }
  }

  /**
   * Intelligently parses SYS, DIA, and PULSE from OCR output
   */
  function parseBpReadings(text) {
    const cleaned = text.replace(/O/g, '0').replace(/o/g, '0').replace(/l/g, '1').replace(/I/g, '1');

    // Strategy 1: Look for labeled blocks
    const sysMatch = cleaned.match(/SYS(?:.*?)[^\d](\d{2,3})/i);
    const diaMatch = cleaned.match(/DIA(?:.*?)[^\d](\d{2,3})/i);
    const pulseMatch = cleaned.match(/PULSE(?:.*?)[^\d](\d{2,3})/i) || cleaned.match(/\/min(?:.*?)[^\d](\d{2,3})/i);

    if (sysMatch) sysField.value = sysMatch[1];
    if (diaMatch) diaField.value = diaMatch[1];
    if (pulseMatch) pulseField.value = pulseMatch[1];

    // Strategy 2: If standard labels weren't isolated, extract 2-3 digit numbers in top-to-bottom sequence
    if (!sysField.value || !diaField.value || !pulseField.value) {
      const numbers = cleaned.match(/\b\d{2,3}\b/g) || [];
      const validNumbers = numbers
        .map(Number)
        .filter(n => n >= 40 && n <= 260); // Standard human physiological range

      if (validNumbers.length >= 3) {
        // Omron & standard BP monitors display top-to-bottom: SYS, DIA, PULSE
        if (!sysField.value) sysField.value = validNumbers[0];
        if (!diaField.value) diaField.value = validNumbers[1];
        if (!pulseField.value) pulseField.value = validNumbers[2];
      } else if (validNumbers.length === 2) {
        if (!sysField.value) sysField.value = validNumbers[0];
        if (!diaField.value) diaField.value = validNumbers[1];
      }
    }
  }

  // Handle Form Submission
  bpForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!currentBase64Image) {
      showAlert('Please upload or snap a picture of the blood pressure monitor first.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<div class="spinner"></div> Submitting to Google Sheet...';
    alertBox.style.display = 'none';

    // Prepare JSON payload
    const payload = {
      date: dateField.value || getFormattedDate(),
      time: timeField.value || getFormattedTime(),
      systolic: sysField.value,
      diastolic: diaField.value,
      pulse: pulseField.value,
      image: {
        base64: currentBase64Image,
        mimeType: currentMimeType,
        filename: currentFileName || `BP_${Date.now()}.jpg`
      }
    };

    try {
      // Content-Type text/plain avoids CORS preflight OPTIONS rejection in Apps Script
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === 'success') {
        noField.value = result.no;
        urlField.value = result.fileUrl;

        showAlert(`✅ Data recorded successfully as Row #${result.no}! Picture uploaded to Drive.`, 'success');

        // Prepare for next entry after 4 seconds
        setTimeout(() => {
          fetchNextSequenceNumber();
          initDateTime();
          currentBase64Image = null;
          previewContainer.style.display = 'none';
          ocrStatus.style.display = 'none';
          imageInput.value = '';
          sysField.value = '';
          diaField.value = '';
          pulseField.value = '';
          urlField.value = '';
        }, 4000);

      } else {
        showAlert(`Error: ${result.message}`, 'error');
      }
    } catch (err) {
      console.error(err);
      showAlert(`Network error: ${err.message}`, 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<span>💾 Submit to Google Sheet</span>';
    }
  });

  function showAlert(msg, type) {
    alertBox.textContent = msg;
    alertBox.className = `alert ${type}`;
    alertBox.style.display = 'block';
  }

  // Initial Load
  initDateTime();
  fetchNextSequenceNumber();
</script>

</body>
</html>
