<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BP Reading Data Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; padding: 24px 16px; }
    .container { width: 100%; max-width: 540px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 28px; }
    h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    p.subtitle { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 24px; }
    
    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      background: #f1f5f9;
      transition: all 0.2s ease;
      position: relative;
    }
    .upload-zone:hover { border-color: var(--primary); background: #eff6ff; }
    .upload-zone input { display: none; }
    .upload-icon { font-size: 2rem; margin-bottom: 6px; }
    .preview-box { display: none; margin-top: 14px; text-align: center; }
    .preview-box img { max-width: 100%; max-height: 220px; border-radius: 8px; border: 1px solid var(--border); object-fit: contain; }

    .status-badge {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .status-loading { background: #e0f2fe; color: #0369a1; display: block; }
    .status-error { background: #fee2e2; color: #b91c1c; display: block; }
    .status-success { background: #dcfce7; color: #15803d; display: block; }

    .form-group { margin-top: 16px; }
    label { display: block; font-size: 0.825rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
    }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    input[readonly] { background: #f8fafc; color: var(--text-muted); cursor: not-allowed; }

    .btn {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 24px;
      transition: background 0.2s ease;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <h2>BP Reading Data</h2>
    <p class="subtitle">Upload or snap a photo of your BP device screen to extract and save measurements.</p>

    <!-- Upload Section -->
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📷</div>
      <div style="font-weight: 600; color: #334155;">Take Photo or Upload Image</div>
      <div style="font-size: 0.75rem; color: #64748b; margin-top: 4px;">JPG, PNG, HEIC from camera or gallery</div>
      <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleFile(this)">
    </div>

    <div id="previewBox" class="preview-box">
      <img id="imagePreview" alt="BP Screen Preview">
    </div>

    <div id="statusAlert" class="status-badge"></div>

    <!-- Form Section -->
    <form id="bpForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label>Systolic (mmHg) - [SYS]</label>
        <input type="number" id="systolic" placeholder="e.g. 120" required min="40" max="250">
      </div>

      <div class="form-group">
        <label>Diastolic (mmHg) - [DIA]</label>
        <input type="number" id="diastolic" placeholder="e.g. 80" required min="30" max="180">
      </div>

      <div class="form-group">
        <label>Pulse (BPM) - [PULSE / min]</label>
        <input type="number" id="pulse" placeholder="e.g. 72" required min="30" max="220">
      </div>

      <div class="form-group">
        <label>Uploaded Picture URL</label>
        <input type="text" id="fileUrl" readonly placeholder="URL generated automatically upon image upload">
      </div>

      <button type="submit" id="submitBtn" class="btn" disabled>Save to Google Sheet</button>
    </form>
  </div>

  <script>
    let uploadedFileUrl = '';

    function handleFile(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];

      // Preview Image
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('imagePreview').src = e.target.result;
        document.getElementById('previewBox').style.display = 'block';

        showStatus('Uploading & scanning BP monitor screen with OCR...', 'status-loading');
        document.getElementById('submitBtn').disabled = true;

        google.script.run
          .withSuccessHandler(onOcrSuccess)
          .withFailureHandler(onOcrFailure)
          .processUploadedImage(e.target.result, file.name, file.type);
      };
      reader.readAsDataURL(file);
    }

    function onOcrSuccess(res) {
      if (!res.success) {
        showStatus('Error processing image: ' + res.error, 'status-error');
        return;
      }

      uploadedFileUrl = res.fileUrl;
      document.getElementById('fileUrl').value = uploadedFileUrl;

      // Populate parsed fields
      if (res.extracted.systolic) document.getElementById('systolic').value = res.extracted.systolic;
      if (res.extracted.diastolic) document.getElementById('diastolic').value = res.extracted.diastolic;
      if (res.extracted.pulse) document.getElementById('pulse').value = res.extracted.pulse;

      showStatus('Image processed! Verify or adjust readings, then save.', 'status-success');
      document.getElementById('submitBtn').disabled = false;
    }

    function onOcrFailure(err) {
      showStatus('Failed to connect to Google Apps Script: ' + err, 'status-error');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      showStatus('Submitting record to Google Sheet...', 'status-loading');

      const payload = {
        systolic: document.getElementById('systolic').value,
        diastolic: document.getElementById('diastolic').value,
        pulse: document.getElementById('pulse').value,
        fileUrl: uploadedFileUrl
      };

      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            showStatus(`Successfully saved! Record #${res.nextNo} created.`, 'status-success');
            document.getElementById('bpForm').reset();
            document.getElementById('previewBox').style.display = 'none';
          } else {
            showStatus('Error saving data: ' + res.error, 'status-error');
            submitBtn.disabled = false;
          }
        })
        .withFailureHandler(function(err) {
          showStatus('Error: ' + err, 'status-error');
          submitBtn.disabled = false;
        })
        .submitBPRecord(payload);
    }

    function showStatus(msg, className) {
      const alert = document.getElementById('statusAlert');
      alert.className = 'status-badge ' + className;
      alert.textContent = msg;
    }
  </script>
</body>
</html>
