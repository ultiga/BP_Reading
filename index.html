<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP Reading Data Logger</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tesseract OCR for client-side text recognition -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">

  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden">
    <!-- Header -->
    <div class="bg-sky-600 px-6 py-5 text-white">
      <h1 class="text-2xl font-bold">BP Reading Data Form</h1>
      <p class="text-sky-100 text-sm mt-1">Capture blood pressure display & log to Google Sheet</p>
    </div>

    <form id="bpForm" class="p-6 space-y-5">

      <!-- Image Upload & Camera Capture -->
      <div>
        <label class="block font-medium text-slate-700 mb-1">Take or Upload Device Picture</label>
        <div class="border-2 border-dashed border-sky-200 rounded-xl p-4 text-center hover:border-sky-400 transition bg-sky-50/40">
          <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden" />
          <button type="button" onclick="document.getElementById('imageInput').click()" 
                  class="bg-white border border-slate-300 px-4 py-2 rounded-lg text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50">
            📷 Select Picture / Take Photo
          </button>
          <p id="fileName" class="text-xs text-slate-500 mt-2 truncate">No file chosen yet</p>
        </div>
      </div>

      <!-- Preview & Scanning Progress -->
      <div id="previewContainer" class="hidden text-center space-y-2">
        <img id="imagePreview" alt="BP Screen Preview" class="max-h-56 mx-auto rounded-lg shadow-sm border border-slate-200 object-contain" />
        <div id="ocrStatus" class="text-xs font-semibold text-sky-700 animate-pulse"></div>
      </div>

      <!-- Form Fields -->
      <div class="grid grid-cols-2 gap-4">
        <!-- Date -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">Date (dd/mm/yyyy)</label>
          <input type="text" id="dateField" readonly class="mt-1 w-full bg-slate-100 border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-600 focus:outline-none" />
        </div>

        <!-- Time -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide">Time (hh:mm AM/PM)</label>
          <input type="text" id="timeField" readonly class="mt-1 w-full bg-slate-100 border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-600 focus:outline-none" />
        </div>
      </div>

      <!-- Blood Pressure Readings -->
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide">Systolic</label>
          <input type="number" id="systolic" required placeholder="120"
                 class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold text-slate-900 focus:ring-2 focus:ring-sky-500 focus:outline-none" />
          <span class="text-[10px] text-slate-400">SYS (mmHg)</span>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide">Diastolic</label>
          <input type="number" id="diastolic" required placeholder="80"
                 class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold text-slate-900 focus:ring-2 focus:ring-sky-500 focus:outline-none" />
          <span class="text-[10px] text-slate-400">DIA (mmHg)</span>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide">Pulse</label>
          <input type="number" id="pulse" required placeholder="72"
                 class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold text-slate-900 focus:ring-2 focus:ring-sky-500 focus:outline-none" />
          <span class="text-[10px] text-slate-400">PULSE (BPM)</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn"
              class="w-full bg-sky-600 hover:bg-sky-700 text-white font-medium py-3 rounded-xl transition duration-150 shadow-md">
        Save to Google Sheet
      </button>

      <!-- Alert Status -->
      <div id="resultMessage" class="hidden text-sm p-3 rounded-lg text-center"></div>
    </form>

    <!-- Local Storage Log Summary -->
    <div class="border-t border-slate-100 bg-slate-50 p-4">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Recent Local Entries (LocalStorage)</h2>
        <button onclick="clearHistory()" class="text-xs text-red-500 hover:underline">Clear Local</button>
      </div>
      <div id="historyList" class="space-y-1 max-h-36 overflow-y-auto text-xs text-slate-600"></div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxm2V7yCXgNbCcmxyagdQHxMf07gGg6QKsAqAEP9Nu5vK1yOCsXPuHac9IPVgSNhVXK/exec';
    const STORAGE_KEY = 'bp_readings_local_cache';

    let currentBase64Image = '';
    let currentFileName = '';
    let currentMimeType = '';

    // Initialize timestamps
    function updateTimestamps() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      document.getElementById('dateField').value = `${dd}/${mm}/${yyyy}`;

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? String(hours).padStart(2, '0') : '12';
      document.getElementById('timeField').value = `${hours}:${minutes} ${ampm}`;
    }

    updateTimestamps();
    setInterval(updateTimestamps, 30000);
    renderLocalHistory();

    // Image change listener & Client-side OCR
    document.getElementById('imageInput').addEventListener('change', async function (e) {
      const file = e.target.files[0];
      if (!file) return;

      currentFileName = file.name;
      currentMimeType = file.type;
      document.getElementById('fileName').textContent = file.name;

      const reader = new FileReader();
      reader.onload = async function (evt) {
        currentBase64Image = evt.target.result;

        // Display preview
        const imgEl = document.getElementById('imagePreview');
        imgEl.src = currentBase64Image;
        document.getElementById('previewContainer').classList.remove('hidden');

        // Trigger OCR
        const ocrLabel = document.getElementById('ocrStatus');
        ocrLabel.textContent = 'Scanning picture with OCR...';

        try {
          const { data: { text } } = await Tesseract.recognize(currentBase64Image, 'eng', {
            logger: m => {
              if (m.status === 'recognizing text') {
                ocrLabel.textContent = `Reading image: ${Math.round(m.progress * 100)}%`;
              }
            }
          });

          ocrLabel.textContent = 'OCR Finished. Verifying values...';
          extractBPValues(text);
        } catch (err) {
          console.error('OCR Error:', err);
          ocrLabel.textContent = 'Auto-read failed. Please type values manually.';
        }
      };
      reader.readAsDataURL(file);
    });

    // Parse readings from text strings
    function extractBPValues(text) {
      const cleaned = text.replace(/,/g, '');
      const numbers = cleaned.match(/\b\d{2,3}\b/g);

      // Simple heuristic for typical BP monitor readouts
      if (numbers && numbers.length >= 2) {
        const candidateNumbers = numbers.map(n => parseInt(n, 10)).filter(n => n >= 35 && n <= 260);
        if (candidateNumbers.length >= 2) {
          // Sort or place top 3: SYS (highest), DIA (middle), PULSE (remaining)
          document.getElementById('systolic').value = candidateNumbers[0] || '';
          document.getElementById('diastolic').value = candidateNumbers[1] || '';
          if (candidateNumbers[2]) {
            document.getElementById('pulse').value = candidateNumbers[2];
          }
        }
      }
    }

    // Form submission
    document.getElementById('bpForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const resultMessage = document.getElementById('resultMessage');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting to Google Sheet...';
      resultMessage.classList.add('hidden');

      const payload = {
        date: document.getElementById('dateField').value,
        time: document.getElementById('timeField').value,
        systolic: document.getElementById('systolic').value,
        diastolic: document.getElementById('diastolic').value,
        pulse: document.getElementById('pulse').value,
        imageBase64: currentBase64Image,
        fileName: currentFileName || `BP_${Date.now()}.jpg`,
        mimeType: currentMimeType || 'image/jpeg'
      };

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const res = await response.json();

        if (res.status === 'success') {
          resultMessage.className = 'text-sm p-3 rounded-lg text-center bg-emerald-100 text-emerald-800';
          resultMessage.innerHTML = `✅ Saved as entry <b>#${res.no}</b> successfully!`;
          resultMessage.classList.remove('hidden');

          // Store in LocalStorage
          saveToLocalStorage({
            no: res.no,
            date: payload.date,
            time: payload.time,
            sys: payload.systolic,
            dia: payload.diastolic,
            pulse: payload.pulse,
            url: res.fileUrl
          });

          // Reset inputs
          document.getElementById('systolic').value = '';
          document.getElementById('diastolic').value = '';
          document.getElementById('pulse').value = '';
          document.getElementById('previewContainer').classList.add('hidden');
          document.getElementById('fileName').textContent = 'No file chosen yet';
          currentBase64Image = '';
        } else {
          throw new Error(res.message || 'Submission error');
        }
      } catch (err) {
        resultMessage.className = 'text-sm p-3 rounded-lg text-center bg-rose-100 text-rose-800';
        resultMessage.textContent = 'Error: ' + err.message;
        resultMessage.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save to Google Sheet';
        updateTimestamps();
      }
    });

    // Local Storage Helpers
    function saveToLocalStorage(record) {
      let cached = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      cached.unshift(record);
      if (cached.length > 20) cached.pop();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cached));
      renderLocalHistory();
    }

    function renderLocalHistory() {
      const container = document.getElementById('historyList');
      const cached = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      if (cached.length === 0) {
        container.innerHTML = '<div class="text-slate-400 italic">No entries saved locally.</div>';
        return;
      }
      container.innerHTML = cached.map(item => `
        <div class="flex justify-between items-center border-b border-slate-100 py-1">
          <span>#${item.no} (${item.date} ${item.time})</span>
          <span class="font-semibold text-slate-800">${item.sys}/${item.dia} mmHg, ${item.pulse} BPM</span>
        </div>
      `).join('');
    }

    function clearHistory() {
      localStorage.removeItem(STORAGE_KEY);
      renderLocalHistory();
    }
  </script>
</body>
</html>
