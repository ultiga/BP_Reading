<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP Reading Data System</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 580px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); padding: 24px; }
    
    h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; color: #0f172a; text-align: center; }
    p.subtitle { font-size: 0.88rem; color: #64748b; text-align: center; margin-bottom: 20px; }

    .upload-box {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      background: #f1f5f9;
      cursor: pointer;
      position: relative;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .upload-box:hover { border-color: var(--primary); }
    .upload-box input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .preview-container { display: none; margin-top: 12px; text-align: center; }
    .preview-container img { max-width: 100%; max-height: 240px; border-radius: 6px; border: 1px solid var(--border); object-fit: contain; }

    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .field-group { display: flex; flex-direction: column; }
    .field-group.full { grid-column: span 2; }
    label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: #475569; margin-bottom: 4px; }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }
    input[readonly] { background-color: #f1f5f9; color: #64748b; }
    input:focus { border-color: var(--primary); }

    .actions { margin-top: 24px; display: flex; gap: 10px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-ocr { background-color: var(--primary); color: white; }
    .btn-ocr:hover { background-color: var(--primary-hover); }
    .btn-save { background-color: var(--success); color: white; display: none; }
    .btn-save:hover { background-color: #15803d; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-msg { margin-top: 14px; font-size: 0.88rem; text-align: center; font-weight: 500; }
    .status-msg.loading { color: var(--primary); }
    .status-msg.success { color: var(--success); }
    .status-msg.error { color: #dc2626; }
  </style>
</head>
<body>

<div class="container">
  <h2>BP Reading Data</h2>
  <p class="subtitle">Capture / upload blood pressure photo to read and log values</p>

  <!-- Upload Area -->
  <div class="upload-box" id="dropArea">
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <div id="uploadPrompt">
      <span style="font-size: 1.8rem; display: block;">📷</span>
      <strong>Tap to take a photo or select an image</strong>
      <p style="font-size: 0.8rem; color: #64748b; margin-top: 4px;">Supports JPG, PNG, WEBP</p>
    </div>
    <div class="preview-container" id="previewContainer">
      <img id="imagePreview" alt="BP Preview">
    </div>
  </div>

  <button type="button" class="btn-ocr" id="btnOcr" disabled>Extract Readings (OCR)</button>

  <!-- Form Fields -->
  <div class="field-grid">
    <div class="field-group">
      <label for="fSys">Systolic (mmHg)</label>
      <input type="number" id="fSys" placeholder="e.g. 120">
    </div>
    <div class="field-group">
      <label for="fDia">Diastolic (mmHg)</label>
      <input type="number" id="fDia" placeholder="e.g. 80">
    </div>
    <div class="field-group">
      <label for="fPulse">Pulse (BPM)</label>
      <input type="number" id="fPulse" placeholder="e.g. 72">
    </div>
    <div class="field-group">
      <label for="fNo">No (Auto)</label>
      <input type="text" id="fNo" value="Auto on submit" readonly>
    </div>
    <div class="field-group">
      <label for="fDate">Date (dd/mm/yyyy)</label>
      <input type="text" id="fDate" readonly>
    </div>
    <div class="field-group">
      <label for="fTime">Time (hh:mm AM/PM)</label>
      <input type="text" id="fTime" readonly>
    </div>
    <div class="field-group full">
      <label for="fUrl">Uploaded Picture URL</label>
      <input type="text" id="fUrl" placeholder="Generated after saving" readonly>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn-save" id="btnSave">Save to Google Sheet</button>
  </div>

  <div class="status-msg" id="statusMessage"></div>
</div>

<script>
  // ==========================================
  // CONFIGURATION: Replace with your Web App URL
  // ==========================================
  const APPS_SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyT0WzgLEi8gxIVCjtOawymXTLIIUI6t5XBRzaxM7PLlbvK3ze_bP7q57dqxTPmnV9O/exec";

  let rawBase64 = "";
  let mimeType = "";

  const fileInput = document.getElementById('fileInput');
  const previewContainer = document.getElementById('previewContainer');
  const imagePreview = document.getElementById('imagePreview');
  const uploadPrompt = document.getElementById('uploadPrompt');
  const btnOcr = document.getElementById('btnOcr');
  const btnSave = document.getElementById('btnSave');
  const statusMessage = document.getElementById('statusMessage');

  // Set real-time clock preview
  function updateDateTime() {
    const now = new Date();
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();
    document.getElementById('fDate').value = `${day}/${month}/${year}`;

    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? String(hours).padStart(2, '0') : '12';
    document.getElementById('fTime').value = `${hours}:${minutes} ${ampm}`;
  }
  updateDateTime();
  setInterval(updateDateTime, 30000);

  // Handle Image Selection
  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    mimeType = file.type || 'image/jpeg';
    const reader = new FileReader();
    reader.onload = function(event) {
      const dataUrl = event.target.result;
      imagePreview.src = dataUrl;
      previewContainer.style.display = 'block';
      uploadPrompt.style.display = 'none';

      // Extract raw base64 string
      rawBase64 = dataUrl.split(',')[1];
      btnOcr.disabled = false;
      btnSave.style.display = 'none';
      setStatus('');
    };
    reader.readAsDataURL(file);
  });

  // Extract Readings via Apps Script OCR
  btnOcr.addEventListener('click', async function() {
    if (!rawBase64) return;

    setStatus('Scanning image using OCR... Please wait.', 'loading');
    btnOcr.disabled = true;

    try {
      const response = await fetch(APPS_SCRIPT_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'ocr',
          base64Data: rawBase64,
          mimeType: mimeType
        })
      });

      const res = await response.json();
      if (res.status === 'success') {
        document.getElementById('fSys').value = res.data.sys || '';
        document.getElementById('fDia').value = res.data.dia || '';
        document.getElementById('fPulse').value = res.data.pulse || '';

        setStatus('Values extracted! Check and adjust numbers if needed before saving.', 'success');
        btnSave.style.display = 'block';
      } else {
        setStatus('OCR Error: ' + res.message, 'error');
      }
    } catch (err) {
      setStatus('Network or endpoint error: ' + err.message, 'error');
    } finally {
      btnOcr.disabled = false;
    }
  });

  // Save to Google Sheet & Drive
  btnSave.addEventListener('click', async function() {
    const sys = document.getElementById('fSys').value;
    const dia = document.getElementById('fDia').value;
    const pulse = document.getElementById('fPulse').value;

    if (!sys || !dia || !pulse) {
      setStatus('Please enter values for Systolic, Diastolic, and Pulse.', 'error');
      return;
    }

    setStatus('Uploading picture to Drive and appending row to Sheet...', 'loading');
    btnSave.disabled = true;

    try {
      const response = await fetch(APPS_SCRIPT_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'save',
          base64Data: rawBase64,
          mimeType: mimeType,
          sys: sys,
          dia: dia,
          pulse: pulse
        })
      });

      const res = await response.json();
      if (res.status === 'success') {
        document.getElementById('fNo').value = res.data.no;
        document.getElementById('fDate').value = res.data.date;
        document.getElementById('fTime').value = res.data.time;
        document.getElementById('fUrl').value = res.data.fileUrl;

        setStatus(`Saved successfully as Entry #${res.data.no}!`, 'success');
        btnSave.style.display = 'none';
      } else {
        setStatus('Save Error: ' + res.message, 'error');
      }
    } catch (err) {
      setStatus('Save failed: ' + err.message, 'error');
    } finally {
      btnSave.disabled = false;
    }
  });

  function setStatus(text, type = '') {
    statusMessage.textContent = text;
    statusMessage.className = 'status-msg ' + type;
  }
</script>
</body>
</html>
