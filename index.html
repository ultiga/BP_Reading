<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP Reading Data - Capture & Record</title>
  <style>
    :root {
      --primary: #007bff;
      --primary-hover: #0056b3;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #dcdfe6;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: var(--card-bg);
      max-width: 500px;
      width: 100%;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      text-align: center;
      color: #1e293b;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
      background: #fafafa;
      transition: border-color 0.2s;
    }

    .upload-zone:hover {
      border-color: var(--primary);
    }

    .preview-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
      object-fit: contain;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .grid-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    button:disabled {
      background: #a0cbf7;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
    }

    .status-msg.success {
      background: #e6f4ea;
      color: #137333;
      display: block;
    }

    .status-msg.error {
      background: #fce8e6;
      color: #c5221f;
      display: block;
    }

    .status-msg.info {
      background: #e8f0fe;
      color: #1a73e8;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>BP Reading Data</h2>
    <p class="subtitle">Upload or take a photo of your BP monitor LCD screen</p>

    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
      <span id="uploadPrompt">📸 Tap to take photo or choose file</span>
      <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;" onchange="handleFileSelect(event)">
      <img id="imagePreview" class="preview-img" alt="Preview">
    </div>

    <form id="bpForm" onsubmit="submitData(event)">
      <div class="grid-row">
        <div class="form-group">
          <label for="sys">SYS (mmHg)</label>
          <input type="number" id="sys" placeholder="Auto / Edit">
        </div>
        <div class="form-group">
          <label for="dia">DIA (mmHg)</label>
          <input type="number" id="dia" placeholder="Auto / Edit">
        </div>
        <div class="form-group">
          <label for="pulse">Pulse (BPM)</label>
          <input type="number" id="pulse" placeholder="Auto / Edit">
        </div>
      </div>

      <button type="submit" id="submitBtn">Save & Sync to Sheet</button>
    </form>

    <div id="statusBox" class="status-msg"></div>
  </div>

  <script>
    // PASTE YOUR DEPLOYED APPS SCRIPT WEB APP URL HERE:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBQwmUQ26OHBgQhwGNQ7uWmrDCW8F5uPQymE-1_kcB7eJuv0kN28jMW23Y2tOh-l3w/exec";

    let selectedBase64 = null;
    let selectedMimeType = "image/jpeg";

    function showStatus(text, type) {
      const box = document.getElementById("statusBox");
      box.textContent = text;
      box.className = "status-msg " + type;
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      selectedMimeType = file.type || "image/jpeg";
      const reader = new FileReader();

      reader.onload = function(e) {
        selectedBase64 = e.target.result;
        const img = document.getElementById("imagePreview");
        img.src = selectedBase64;
        img.style.display = "block";
        document.getElementById("uploadPrompt").textContent = "Image selected (Tap to change)";
      };

      reader.readAsDataURL(file);
    }

    async function submitData(e) {
      e.preventDefault();

      if (!selectedBase64) {
        showStatus("Please take or upload a photo first.", "error");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      showStatus("Uploading photo and running OCR extraction...", "info");

      const payload = {
        base64: selectedBase64,
        mimeType: selectedMimeType,
        sysOverride: document.getElementById("sys").value.trim() || null,
        diaOverride: document.getElementById("dia").value.trim() || null,
        pulseOverride: document.getElementById("pulse").value.trim() || null
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const res = await response.json();

        if (res.status === "success") {
          const d = res.data;
          // Populate the fields with extracted values
          document.getElementById("sys").value = d.systolic || "";
          document.getElementById("dia").value = d.diastolic || "";
          document.getElementById("pulse").value = d.pulse || "";

          showStatus(`✓ Saved as #${d.no} on ${d.date} ${d.time}. SYS: ${d.systolic}, DIA: ${d.diastolic}, Pulse: ${d.pulse}`, "success");
        } else {
          showStatus("Error: " + res.message, "error");
        }
      } catch (err) {
        showStatus("Submission failed: " + err.message, "error");
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
